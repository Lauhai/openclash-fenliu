custom_proxy_group=🌐 其他地区`select`(?=.*(CF电信|CF))^((?!(深港|香港|US|家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$
